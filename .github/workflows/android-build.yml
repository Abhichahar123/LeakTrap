name: Android build

on:
  push:
    branches:
      - claude/festive-mendel-jffh5k
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default also requests the removed "tools" package, which makes sdkmanager fail.
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Also validates the checked-in Gradle wrapper jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify debug APK exists
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "::error::$apk was not produced"; exit 1; }
          ls -l "$apk"
          sha256sum "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: leaktrace-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaktrace-unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
